<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="560" viewBox="0 0 1024 560">

  <defs>
    <g id="tb-content">
      <rect x="0" y="0" width="1024" height="560" fill="#2C2320" opacity="0.5"/>

      <!-- staggered trunks, period 512 repeated twice so the tile edges line up -->
      <g fill="#3F3128" stroke="#3A2E2A" stroke-width="2.5" stroke-linejoin="round">
        <rect x="10" y="160" width="32" height="400" rx="4"/>
        <rect x="95" y="120" width="44" height="440" rx="5"/>
        <rect x="230" y="220" width="26" height="340" rx="3"/>
        <rect x="340" y="140" width="38" height="420" rx="4"/>
        <rect x="522" y="160" width="32" height="400" rx="4"/>
        <rect x="607" y="120" width="44" height="440" rx="5"/>
        <rect x="742" y="220" width="26" height="340" rx="3"/>
        <rect x="852" y="140" width="38" height="420" rx="4"/>
      </g>
      <g fill="#2A2118" opacity="0.5">
        <rect x="10" y="160" width="13" height="400"/>
        <rect x="95" y="120" width="17" height="440"/>
        <rect x="230" y="220" width="10" height="340"/>
        <rect x="340" y="140" width="15" height="420"/>
        <rect x="522" y="160" width="13" height="400"/>
        <rect x="607" y="120" width="17" height="440"/>
        <rect x="742" y="220" width="10" height="340"/>
        <rect x="852" y="140" width="15" height="420"/>
      </g>

      <!-- hanging moss -->
      <g fill="none" stroke="#5C6B4A" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
        <path d="M26,160 Q22,192 27,215 Q23,232 27,248"/>
        <path d="M117,120 Q112,158 118,188 Q113,210 118,232"/>
        <path d="M243,220 Q239,244 244,262"/>
        <path d="M359,140 Q354,172 360,198 Q356,216 360,236"/>
        <path d="M538,160 Q534,192 539,215 Q535,232 539,248"/>
        <path d="M629,120 Q624,158 630,188 Q625,210 630,232"/>
        <path d="M755,220 Q751,244 756,262"/>
        <path d="M871,140 Q866,172 872,198 Q868,216 872,236"/>
      </g>
      <g fill="#5C6B4A" opacity="0.85">
        <ellipse cx="27" cy="251" rx="4" ry="6"/>
        <ellipse cx="118" cy="235" rx="4" ry="6"/>
        <ellipse cx="244" cy="265" rx="3.5" ry="5"/>
        <ellipse cx="360" cy="239" rx="4" ry="6"/>
        <ellipse cx="539" cy="251" rx="4" ry="6"/>
        <ellipse cx="630" cy="235" rx="4" ry="6"/>
        <ellipse cx="756" cy="265" rx="3.5" ry="5"/>
        <ellipse cx="872" cy="239" rx="4" ry="6"/>
      </g>
    </g>

    <clipPath id="tb-lower"><rect x="0" y="186.67" width="1024" height="373.33"/></clipPath>
    <clipPath id="tb-band4"><rect x="0" y="149.33" width="1024" height="37.34"/></clipPath>
    <clipPath id="tb-band3"><rect x="0" y="112.00" width="1024" height="37.33"/></clipPath>
    <clipPath id="tb-band2"><rect x="0" y="74.67" width="1024" height="37.33"/></clipPath>
    <clipPath id="tb-band1"><rect x="0" y="37.33" width="1024" height="37.34"/></clipPath>
    <clipPath id="tb-band0"><rect x="0" y="0" width="1024" height="37.33"/></clipPath>
  </defs>

  <!-- bottom two-thirds: full strength -->
  <use href="#tb-content" clip-path="url(#tb-lower)"/>

  <!-- top third: stepped flat-opacity bands dissolving into the sky, no gradient -->
  <use href="#tb-content" clip-path="url(#tb-band4)" opacity="0.82"/>
  <use href="#tb-content" clip-path="url(#tb-band3)" opacity="0.62"/>
  <use href="#tb-content" clip-path="url(#tb-band2)" opacity="0.42"/>
  <use href="#tb-content" clip-path="url(#tb-band1)" opacity="0.22"/>
  <use href="#tb-content" clip-path="url(#tb-band0)" opacity="0.08"/>

</svg>
