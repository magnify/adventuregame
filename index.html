<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Three Suns</title>

  <meta name="description" content="A tap-to-explore story for children." />

  <!-- iPad/iPhone home-screen behaviour -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Three Suns" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#101830" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" href="/icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #e9dcc4; overflow: hidden; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    /* the loading screen is the street's own morning sky with a scrap of paper on it, so the game opens in its own look */
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #e9dcc4 url('art/street-sky.webp') center / cover no-repeat; color: #5a4636;
      font-family: 'Mali', sans-serif; font-size: 1.3rem;
      transition: opacity 0.6s ease;
      z-index: 10;
    }
    #loading span {
      background: #f3ead8; padding: 18px 34px 20px; transform: rotate(-2deg);
      border-radius: 46% 54% 48% 52% / 58% 44% 56% 42%;
      box-shadow: inset 0 0 0 1px rgba(120, 95, 70, .15), 0 2px 1px rgba(90, 70, 50, .25), 0 12px 24px rgba(60, 45, 30, .25);
    }
    #loading.off { opacity: 0; pointer-events: none; }
    #ui {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      font-family: 'Mali', sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="loading"><span>Cutting out the street…</span></div>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
